<agent_config os="Linux"><sca><enabled>yes</enabled><scan_on_start>yes</scan_on_start><interval>12h</interval><skip_nfs>yes</skip_nfs><policies><policy>etc/shared/iso27001_2022_linux_endpoint.yml</policy></policies></sca>
  <!-- ISO 27001 evidence collector: needs wazuh_command.remote_commands=1 in the agent's local_internal_options.conf -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>iso27001-evidence</tag>
    <command>/usr/bin/python3 /var/ossec/etc/shared/iso27001_collect.py</command>
    <interval>6h</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>900</timeout>
  </wodle>
</agent_config>
