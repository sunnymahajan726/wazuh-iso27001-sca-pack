<agent_config os="Windows"><sca><enabled>yes</enabled><scan_on_start>yes</scan_on_start><interval>12h</interval><policies><policy>shared/iso27001_2022_windows_endpoint.yml</policy></policies></sca>
  <!-- ISO 27001 evidence collector: needs wazuh_command.remote_commands=1 in the agent's local_internal_options.conf -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>iso27001-evidence</tag>
    <command>C:\Windows\Sysnative\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File shared\iso27001_collect.ps1</command>
    <interval>6h</interval>
    <ignore_output>no</ignore_output>
    <run_on_start>yes</run_on_start>
    <timeout>1200</timeout>
  </wodle>
</agent_config>
