      - {metric: edge_smartscreen_on, os: windows, desc: Edge SmartScreen is not disabled, eq: true, weight: 10}
      - {metric: edge_smartscreen_enforced, os: windows, desc: Edge SmartScreen is enforced by policy, eq: true, weight: 5}
