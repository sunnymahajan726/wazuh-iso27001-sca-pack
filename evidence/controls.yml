      - {metric: default_inbound_deny, os: linux, desc: Inbound traffic is denied by default, eq: true, weight: 25}
      - {metric: kernel_network_hardening_pct, os: linux, desc: Kernel network hardening settings applied, min: 100, partial: 70, weight: 20}
      - {metric: firewall_all_profiles_enabled, os: windows, desc: Firewall is on for every profile, eq: true, weight: 25}
      - {metric: default_inbound_block, os: windows, desc: Inbound traffic is blocked by default, eq: true, weight: 20}
      - {metric: inbound_allow_rules_public, os: windows, desc: At most 10 inbound allow rules on public networks, max: 10, partial: 25, weight: 10}
      - {metric: firewall_stopped_events_window, os: windows, desc: Firewall was not stopped in the window, max: 0, weight: 10}
      - {metric: firewall_logs_drops, desc: Dropped connections are logged, eq: true, weight: 15}
      - {metric: exposed_listening_services, desc: At most 5 services listen on the network, max: 5, partial: 10, weight: 15}
      - {metric: firewall_rule_changes_window, os: windows, desc: Firewall rule/setting changes in the window, weight: 0}

  A.8.21:
    name: Security of network services
    criteria:
      - {metric: legacy_services_installed, os: linux, desc: No telnet/rsh/tftp/NIS services installed, max: 0, weight: 25}
      - {metric: plaintext_listeners, os: linux, desc: No plaintext protocols listening, max: 0, weight: 25}
      - {metric: ssh_weak_algorithms, os: linux, desc: SSH offers no weak ciphers/MACs/key exchange, max: 0, partial: 2, weight: 20}
      - {metric: ssh_x11_forwarding, os: linux, desc: SSH X11 forwarding is off, eq: false, weight: 10}
      - {metric: smb_min_protocol_ok, os: linux, desc: Samba refuses SMBv1, eq: true, weight: 10, na_if_missing: true}
      - {metric: nfs_insecure_exports, os: linux, desc: No NFS exports with no_root_squash/insecure, max: 0, weight: 10}
      - {metric: smb1_server_enabled, os: windows, desc: SMBv1 server is off, eq: false, weight: 25}
      - {metric: smb1_client_enabled, os: windows, desc: SMBv1 client is off, eq: false, weight: 15}
      - {metric: llmnr_disabled, os: windows, desc: LLMNR name resolution is off, eq: true, weight: 15}
      - {metric: netbios_disabled_pct, os: windows, desc: NetBIOS over TCP/IP is off on all adapters, min: 100, partial: 50, weight: 10}
      - {metric: legacy_tls_enabled, os: windows, desc: SSL 3.0/TLS 1.0/1.1 are not enabled for servers, eq: false, weight: 15}
      - {metric: smb1_access_attempts_window, os: windows, desc: No SMBv1 connection attempts in the window, max: 0, weight: 10}
      - {metric: rdp_enabled, os: windows, desc: Remote Desktop enabled, weight: 0}

  A.8.22:
